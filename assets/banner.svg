<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Background Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .anim-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-flow {
      stroke-dasharray: 12, 12;
      animation: flowLine 15s linear infinite;
    }
    .anim-float-1 {
      animation: floatCard 5s ease-in-out infinite;
    }
    .anim-float-2 {
      animation: floatCard 7s ease-in-out infinite 1s;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Background Dynamic Decorative Blobs -->
  <circle cx="150" cy="80" r="140" fill="#06b6d4" class="anim-glow" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#a855f7" class="anim-glow" opacity="0.2" filter="url(#glow)" />

  <!-- Background Flow Lines (SCM / Planning Graph) -->
  <g opacity="0.3">
    <path d="M 100 280 Q 300 200 500 260 T 900 180 T 1100 240" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-flow" />
    <path d="M 50 120 Q 350 220 650 140 T 1150 100" fill="none" stroke="#818cf8" stroke-width="1.5" class="anim-flow" />
  </g>

  <!-- Dynamic Background Pill / Cards (Rendered BEFORE Text so Text stays in foreground) -->
  <g class="anim-float-1">
    <rect x="850" y="55" width="260" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="880" cy="90" r="16" fill="#06b6d4" opacity="0.8" />
    <text x="880" y="95" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">📈</text>
    <text x="910" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Demand &amp; Supply</text>
    <text x="910" y="103" fill="#94a3b8" font-family="sans-serif" font-size="12">Concurrent S&amp;OP Engine</text>
  </g>

  <g class="anim-float-2">
    <rect x="880" y="215" width="240" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" />
    <circle cx="910" cy="250" r="16" fill="#8b5cf6" opacity="0.8" />
    <text x="910" y="255" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">⚡</text>
    <text x="940" y="245" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">What-If Scenarios</text>
    <text x="940" y="263" fill="#94a3b8" font-family="sans-serif" font-size="12">Financial Alignment</text>
  </g>

  <!-- Foreground Content: Header Tag, Title, and Subtitle -->
  <!-- Top Pill Tag -->
  <rect x="70" y="55" width="310" height="34" rx="17" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
  <text x="85" y="77" class="badge-text">🚀 ENTERPRISE &amp; OPEN-SOURCE SCM</text>

  <!-- Title -->
  <text x="70" y="145" class="title">Awesome Integrated</text>
  <text x="70" y="195" class="title" fill="url(#cyanPurple)">Business Planning (IBP)</text>

  <!-- Subtitle -->
  <text x="70" y="250" class="subtitle">A Curated Ecosystem of SaaS Platforms &amp; Open-Source Tools</text>
  <text x="70" y="280" font-family="sans-serif" font-size="15" fill="#94a3b8">For S&amp;OP, Demand Forecasting, Supply Chain Planning &amp; Financial Scenario Modeling</text>
</svg>
